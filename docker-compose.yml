services:
  db:
    image: postgres:16-alpine
    container_name: remotely-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: remotely
      POSTGRES_PASSWORD: remotely_dev_password
      POSTGRES_DB: remotely
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remotely -d remotely"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data: